<!DOCTYPE html>
<html>
<head>
    <title>Forms</title>

    <style>
        div {
            border: 2px solid black;
            margin: 20px;
            padding: 15px;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>

<body>

<!-- Question 2 -->
<div>

    <h2>Visitors Information</h2>

    <form>
        Email Address:
        <input type="text" name="email">
        <br><br>

        Interest:
        <input type="checkbox"> Web for Research
        <input type="checkbox"> Web for Purchase
        <br><br>

        Occupation:
        <select>
            <option>Select one</option>
            <option>Student</option>
            <option>Employee</option>
            <option>Teacher</option>
            <option>Business</option>
        </select>
        <br><br>

        Want us to send you junk emails?
        <input type="radio" name="junk"> Absolutely
        <input type="radio" name="junk"> No way man
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>

</div>


<!-- Question 3 -->
<div>

    <h2>Online Registration</h2>

    <form>
        Username:
        <input type="text">
        <br><br>

        Password:
        <input type="password">
        <br><br>

        Confirm Password:
        <input type="password">
        <br><br>

        Name:
        <input type="text">
        <br><br>

        Gender:
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        Address:
        <br>
        <textarea rows="5" cols="30"></textarea>
        <br><br>

        Profession:
        <select>
            <option>Select Profession</option>
            <option>Student</option>
            <option>Engineer</option>
            <option>Teacher</option>
            <option>Doctor</option>
        </select>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>

</div>

</body>
</html>
